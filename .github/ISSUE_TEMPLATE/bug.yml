name: Something's broken
description: A page, room, or feature that doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: did
    attributes:
      label: What you did
      description: The steps, starting from which page. Short is fine.
      placeholder: "1. Opened a room from the groups page\n2. Started the timer\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Add a screenshot or a console error if you have one.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Android
  - type: markdown
    attributes:
      value: For anything security-related, use [private reporting](https://github.com/ManasDasri/Flow-study/security/advisories/new) instead of a public issue.
