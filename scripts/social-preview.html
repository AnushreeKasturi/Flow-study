<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Flow social preview artwork</title>
    <style>
        /* The same self-hosted face the site uses; no network needed to generate the image. */
        @font-face { font-family: 'Bricolage'; src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wdth-normal.woff2') format('woff2'); font-weight: 200 800; font-stretch: 75% 100%; }
        * { box-sizing: border-box; margin: 0; }
        body { position: relative; width: 1200px; height: 630px; overflow: hidden; font-family: 'Bricolage', sans-serif; color: #fdf0e6; background: #1f1024; }
        .sky { position: absolute; inset: 0 0 auto; height: 300px; overflow: hidden; background: linear-gradient(#40204a, #e8744c); }
        .sky::before { content: ''; position: absolute; inset: 0; background: radial-gradient(55% 70% at 78% 100%, #ffd98a99, transparent 72%); }
        .sun { position: absolute; left: 78%; top: 96px; width: 330px; height: 330px; translate: -50% 0; border-radius: 50%; background: radial-gradient(circle at 50% 46%, #fff3d4 0%, #ffd98a 58%, #fbc77f 100%); box-shadow: 0 0 20px #ffd98af2, 0 0 90px #ffd98a8c, 0 0 260px #ffd98a52; }
        .brand { position: absolute; left: 64px; top: 48px; display: flex; align-items: baseline; font-size: 54px; font-weight: 800; font-stretch: 80%; letter-spacing: -.045em; line-height: 1; }
        .brand i { width: 11px; height: 11px; margin-left: 3px; border-radius: 50%; background: #ffd98a; }
        h1 { position: absolute; left: 64px; top: 322px; font-size: 136px; font-weight: 800; font-stretch: 78%; line-height: .86; letter-spacing: -.035em; }
        p { position: absolute; left: 64px; bottom: 44px; font-size: 26px; color: #dcc4cf; }
        .clock { position: absolute; right: 64px; bottom: 40px; font-size: 76px; font-weight: 800; font-stretch: 78%; font-variant-numeric: tabular-nums; line-height: 1; }
    </style>
</head>
<body>
    <div class="sky"><div class="sun"></div></div>
    <div class="brand">flow<i></i></div>
    <h1>Study until<br>the sun sets.</h1>
    <p>A shared study room. Free and open source. flow-study.me</p>
    <div class="clock">25:00</div>
</body>
</html>
